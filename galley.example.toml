# Copy to galley.local.toml (gitignored) and edit.

[paths]
paper_repo  = "/Users/you/papers/my-paper"
# The codebase, mounted beside the paper so Claude can read what the
# experiments actually did before it describes them.
code_mirror = "/Users/you/code/my-project"
# SQLite state and the LaTeX build directory. Small; keep it somewhere durable.
state_dir   = ".galley"

[paper]
# The branch you merge onto, and the Overleaf remote. On a repo cloned straight
# from the Overleaf git bridge these are all "master"/"origin".
main_branch     = "master"
overleaf_remote = "origin"
overleaf_branch = "master"
main_tex        = "main.tex"

[server]
# Loopback only. Anyone who can reach this port can spawn agents and write files
# in the paper repo; reach it from elsewhere with
#   ssh -L 8124:localhost:8124 <host>
bind = "127.0.0.1"
port = 8124

[limits]
# Worktrees make it easy to run several agents at once and exhaust your
# subscription window.
max_concurrent_sessions = 2

# Do NOT put ANTHROPIC_API_KEY in the environment. Galley strips it at spawn so
# the agent uses your Claude subscription rather than metered API billing, and
# fails startup loudly if it finds one.
