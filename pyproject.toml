[project]
name = "galley"
version = "0.1.0"
description = "A local workbench for writing papers with Claude, with cluster experiments and manual sentence-level merging"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "claude-agent-sdk>=0.1",
    "httpx>=0.27",
]

[project.scripts]
galley = "galley.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["galley"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
